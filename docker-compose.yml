services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: explore
      POSTGRES_PASSWORD: explore
      POSTGRES_DB: explore
    ports:
      - '5432:5432'
    volumes:
      - explore_pg:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  explore_pg:

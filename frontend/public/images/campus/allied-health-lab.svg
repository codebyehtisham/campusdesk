<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the allied health sciences laboratory">
  <defs>
    <linearGradient id="roomAH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef2f7"/>
      <stop offset="100%" stop-color="#dde6ef"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#roomAH)"/>
  <rect x="0" y="440" width="800" height="60" fill="#c6cdd6"/>
  <rect x="0" y="0" width="800" height="50" fill="#c2ccd8"/>
  <!-- physio table -->
  <g>
    <rect x="90" y="300" width="220" height="18" rx="6" fill="#ffffff" stroke="#b7c2cf" stroke-width="3"/>
    <rect x="100" y="318" width="14" height="60" fill="#8a95a3"/>
    <rect x="286" y="318" width="14" height="60" fill="#8a95a3"/>
    <rect x="120" y="282" width="80" height="20" rx="6" fill="#4fd1c5" opacity="0.8"/>
  </g>
  <!-- treadmill / rehab equipment -->
  <g>
    <rect x="370" y="330" width="150" height="16" rx="4" fill="#546578"/>
    <rect x="380" y="270" width="10" height="62" fill="#546578"/>
    <rect x="500" y="270" width="10" height="62" fill="#546578"/>
    <rect x="370" y="260" width="150" height="16" rx="6" fill="#8C1515" opacity="0.75"/>
  </g>
  <!-- microscope station -->
  <g>
    <rect x="580" y="330" width="140" height="16" rx="4" fill="#ffffff" stroke="#b7c2cf" stroke-width="3"/>
    <rect x="600" y="300" width="10" height="30" fill="#333"/>
    <rect x="590" y="290" width="30" height="14" rx="3" fill="#333"/>
    <circle cx="605" cy="286" r="6" fill="#4fd1c5"/>
    <rect x="660" y="300" width="10" height="30" fill="#333"/>
    <rect x="650" y="290" width="30" height="14" rx="3" fill="#333"/>
    <circle cx="665" cy="286" r="6" fill="#4fd1c5"/>
  </g>
  <!-- wall shelf with jars -->
  <g>
    <rect x="60" y="90" width="260" height="10" fill="#8a95a3"/>
    <circle cx="90" cy="70" r="16" fill="#bfe0ea" stroke="#8fb9c6" stroke-width="2"/>
    <circle cx="130" cy="70" r="16" fill="#c9e7c2" stroke="#93c48a" stroke-width="2"/>
    <circle cx="170" cy="70" r="16" fill="#f0d3a0" stroke="#d4ac6b" stroke-width="2"/>
    <circle cx="210" cy="70" r="16" fill="#e7c2d0" stroke="#c88fa3" stroke-width="2"/>
    <circle cx="250" cy="70" r="16" fill="#bfe0ea" stroke="#8fb9c6" stroke-width="2"/>
  </g>
  <!-- anatomy poster -->
  <rect x="600" y="60" width="120" height="150" rx="4" fill="#ffffff" stroke="#b7c2cf" stroke-width="3"/>
  <path d="M660 90 v90 M630 110 q30 -10 60 0 M630 150 q30 10 60 0" stroke="#8C1515" stroke-width="3" fill="none" opacity="0.65"/>
  <text x="400" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#33455a" opacity="0.6">ALLIED HEALTH SCIENCES LABORATORY</text>
</svg>

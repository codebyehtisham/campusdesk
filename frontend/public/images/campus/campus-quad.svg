  <rect x="500" y="150" width="260" height="140" fill="#dccba3"/>
  <polygon points="490,150 630,100 770,150" fill="#8C1515" opacity="0.9"/>
  <g fill="#a9c9d8" opacity="0.9">
    <rect x="520" y="180" width="26" height="34"/>
    <rect x="560" y="180" width="26" height="34"/>
    <rect x="600" y="180" width="26" height="34"/>
    <rect x="680" y="180" width="26" height="34"/>
    <rect x="720" y="180" width="26" height="34"/>
  </g>
  <!-- lawn -->
  <rect x="0" y="290" width="800" height="210" fill="#7fa06b"/>
  <rect x="0" y="280" width="800" height="14" fill="#6c8f5c"/>
  <!-- path -->
  <path d="M0 400 C 250 350 550 450 800 380 L800 500 L0 500 Z" fill="#d8c7a3"/>
  <!-- trees -->
  <g>
    <circle cx="90" cy="330" r="38" fill="#4f7a44"/>
    <circle cx="60" cy="350" r="28" fill="#5c8a4f"/>
    <rect x="83" y="360" width="14" height="40" fill="#5b4028"/>

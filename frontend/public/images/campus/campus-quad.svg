  <g>
    <circle cx="220" cy="400" r="16" fill="#e6c9a8"/>
    <path d="M198 460 C198 430 208 415 220 415 C232 415 242 430 242 460 Z" fill="#8C1515"/>
  </g>
  <g>
    <circle cx="270" cy="410" r="15" fill="#dcb894"/>
    <path d="M250 465 C250 438 259 424 270 424 C281 424 290 438 290 465 Z" fill="#1b3a5c"/>
  </g>
  <g>
    <circle cx="420" cy="420" r="15" fill="#e6c9a8"/>

  </g>
  <!-- students sitting on bench -->
  <rect x="480" y="430" width="120" height="10" fill="#8a5e2f"/>
  <rect x="490" y="440" width="8" height="30" fill="#6b4423"/>
  <rect x="590" y="440" width="8" height="30" fill="#6b4423"/>
  <g>
    <circle cx="520" cy="410" r="14" fill="#dcb894"/>

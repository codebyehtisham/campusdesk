      <stop offset="0%" stop-color="#a9cbe0"/>
      <stop offset="100%" stop-color="#e7f2f7"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#skyCQ)"/>
  <circle cx="120" cy="90" r="40" fill="#fff4d6" opacity="0.9"/>

    <g>
      <rect x="390" y="340" width="140" height="18" rx="4" fill="#7a5230"/>
      <circle cx="425" cy="316" r="18" fill="#dcb894"/>
      <rect x="404" y="332" width="42" height="30" rx="9" fill="#1b3a5c"/>
      <circle cx="505" cy="316" r="18" fill="#e6c9a8"/>
      <rect x="484" y="332" width="42" height="30" rx="9" fill="#2e5339"/>
    </g>
    <g>

<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a lecture hall classroom">
  <defs>
    <linearGradient id="roomLH" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4ede1"/>
      <stop offset="100%" stop-color="#e6dac4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#roomLH)"/>
  <rect x="0" y="0" width="800" height="60" fill="#d8c7a3"/>
  <!-- whiteboard -->
  <rect x="230" y="70" width="340" height="130" fill="#ffffff" stroke="#c9c2b0" stroke-width="6"/>
  <g stroke="#8C1515" stroke-width="4" opacity="0.75" fill="none">
    <path d="M255 110 h120"/>
    <path d="M255 135 h200"/>
    <path d="M255 160 h150"/>
  </g>
  <!-- projector screen glow -->
  <rect x="230" y="70" width="340" height="130" fill="#8C1515" opacity="0.03"/>
  <!-- desk rows with students (simple shapes) -->
  <g>
    <!-- row 1 -->
    <g>
      <rect x="120" y="260" width="120" height="16" rx="4" fill="#7a5230"/>
      <circle cx="150" cy="238" r="16" fill="#e6c9a8"/>

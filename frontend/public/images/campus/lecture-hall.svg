      <circle cx="665" cy="316" r="18" fill="#e6c9a8"/>
      <rect x="644" y="332" width="42" height="30" rx="9" fill="#8C1515"/>
      <circle cx="745" cy="316" r="18" fill="#dcb894"/>
      <rect x="724" y="332" width="42" height="30" rx="9" fill="#1b3a5c"/>

      <circle cx="220" cy="238" r="16" fill="#dcb894"/>
      <rect x="202" y="252" width="36" height="26" rx="8" fill="#1b3a5c"/>
    </g>
    <g>
      <rect x="340" y="260" width="120" height="16" rx="4" fill="#7a5230"/>
      <circle cx="370" cy="238" r="16" fill="#e6c9a8"/>

      <circle cx="440" cy="238" r="16" fill="#dcb894"/>
      <rect x="422" y="252" width="36" height="26" rx="8" fill="#8C1515"/>
    </g>
    <g>
      <rect x="560" y="260" width="120" height="16" rx="4" fill="#7a5230"/>
      <circle cx="590" cy="238" r="16" fill="#dcb894"/>
      <rect x="572" y="252" width="36" height="26" rx="8" fill="#1b3a5c"/>

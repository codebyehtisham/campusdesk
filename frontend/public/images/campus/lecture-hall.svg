    </g>
    <!-- row 2 -->
    <g>
      <rect x="150" y="340" width="140" height="18" rx="4" fill="#7a5230"/>
      <circle cx="185" cy="316" r="18" fill="#e6c9a8"/>
      <rect x="164" y="332" width="42" height="30" rx="9" fill="#2e5339"/>
      <circle cx="265" cy="316" r="18" fill="#dcb894"/>
      <rect x="244" y="332" width="42" height="30" rx="9" fill="#8C1515"/>

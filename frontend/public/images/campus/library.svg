<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of the college library">
  <defs>
    <linearGradient id="roomLB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f1e3"/>
      <stop offset="100%" stop-color="#ecdfc4"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#roomLB)"/>
  <rect x="0" y="440" width="800" height="60" fill="#c9b48c"/>
  <!-- bookshelves back wall -->
  <g>
    <rect x="40" y="60" width="720" height="220" fill="#7a5230"/>
    <g fill="#8C1515">
      <rect x="55" y="75" width="18" height="60"/>
      <rect x="78" y="75" width="14" height="60"/>
      <rect x="97" y="75" width="20" height="60"/>
    </g>
    <g fill="#1b3a5c">
      <rect x="130" y="75" width="16" height="60"/>
      <rect x="151" y="75" width="18" height="60"/>
      <rect x="174" y="75" width="14" height="60"/>
    </g>
    <g fill="#2e5339">
      <rect x="205" y="75" width="20" height="60"/>
      <rect x="230" y="75" width="14" height="60"/>
      <rect x="249" y="75" width="18" height="60"/>
    </g>
    <g fill="#c99a3f">
      <rect x="280" y="75" width="16" height="60"/>
      <rect x="301" y="75" width="20" height="60"/>
      <rect x="326" y="75" width="14" height="60"/>
    </g>
    <!-- repeat pattern across width -->
    <g fill="#8C1515">
      <rect x="360" y="75" width="18" height="60"/>
      <rect x="383" y="75" width="14" height="60"/>
      <rect x="402" y="75" width="20" height="60"/>
    </g>
    <g fill="#1b3a5c">
      <rect x="435" y="75" width="16" height="60"/>
      <rect x="456" y="75" width="18" height="60"/>
      <rect x="479" y="75" width="14" height="60"/>
    </g>
    <g fill="#2e5339">
      <rect x="510" y="75" width="20" height="60"/>
      <rect x="535" y="75" width="14" height="60"/>
      <rect x="554" y="75" width="18" height="60"/>
    </g>
    <g fill="#c99a3f">
      <rect x="585" y="75" width="16" height="60"/>
      <rect x="606" y="75" width="20" height="60"/>
      <rect x="631" y="75" width="14" height="60"/>
    </g>
    <!-- second shelf row -->
    <rect x="40" y="150" width="720" height="10" fill="#5b3d24"/>
    <g fill="#8C1515">
      <rect x="55" y="165" width="18" height="55"/>
      <rect x="78" y="165" width="14" height="55"/>
    </g>
    <g fill="#1b3a5c">
      <rect x="130" y="165" width="16" height="55"/>
      <rect x="151" y="165" width="18" height="55"/>
    </g>
    <g fill="#2e5339">
      <rect x="205" y="165" width="20" height="55"/>
      <rect x="230" y="165" width="14" height="55"/>
    </g>
    <rect x="40" y="60" width="720" height="10" fill="#5b3d24"/>
  </g>
  <!-- reading tables -->
  <g>
    <rect x="120" y="330" width="200" height="14" rx="4" fill="#a9773f"/>
    <rect x="130" y="344" width="10" height="60" fill="#8a5e2f"/>
    <rect x="300" y="344" width="10" height="60" fill="#8a5e2f"/>
    <rect x="160" y="300" width="26" height="34" rx="2" fill="#8C1515" opacity="0.7"/>
    <rect x="230" y="300" width="26" height="34" rx="2" fill="#1b3a5c" opacity="0.7"/>
  </g>
  <g>
    <rect x="480" y="330" width="200" height="14" rx="4" fill="#a9773f"/>
    <rect x="490" y="344" width="10" height="60" fill="#8a5e2f"/>
    <rect x="660" y="344" width="10" height="60" fill="#8a5e2f"/>
    <rect x="520" y="300" width="26" height="34" rx="2" fill="#2e5339" opacity="0.7"/>
    <rect x="590" y="300" width="26" height="34" rx="2" fill="#c99a3f" opacity="0.7"/>
  </g>
  <text x="400" y="35" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#5b3d24" opacity="0.6">COLLEGE LIBRARY &amp; RESOURCE CENTER</text>
</svg>

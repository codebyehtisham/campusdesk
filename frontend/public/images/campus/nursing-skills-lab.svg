<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of a nursing skills and simulation lab">
  <defs>
    <linearGradient id="roomNL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eaf4f4"/>
      <stop offset="100%" stop-color="#d9ecec"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#roomNL)"/>
  <rect x="0" y="0" width="800" height="50" fill="#c7e0e0"/>
  <rect x="0" y="440" width="800" height="60" fill="#cfd8d8"/>
  <!-- window -->
  <rect x="60" y="80" width="180" height="120" fill="#bfe0ea" stroke="#8fb9c6" stroke-width="6"/>
  <line x1="150" y1="80" x2="150" y2="200" stroke="#8fb9c6" stroke-width="4"/>
  <!-- hospital bed 1 -->
  <g>
    <rect x="330" y="260" width="220" height="16" rx="6" fill="#ffffff" stroke="#c3d0d0" stroke-width="3"/>
    <rect x="330" y="230" width="220" height="34" rx="8" fill="#ffffff" stroke="#c3d0d0" stroke-width="3"/>
    <rect x="322" y="220" width="16" height="70" fill="#9aa8a8"/>
    <rect x="542" y="220" width="16" height="70" fill="#9aa8a8"/>
    <ellipse cx="365" cy="238" rx="20" ry="12" fill="#e6c9a8"/>
    <rect x="380" y="235" width="120" height="20" rx="8" fill="#8C1515" opacity="0.75"/>
  </g>
  <!-- monitor stand -->
  <g>
    <rect x="580" y="150" width="14" height="120" fill="#7f8c8c"/>
    <rect x="555" y="120" width="90" height="60" rx="6" fill="#1b3a5c"/>
    <rect x="565" y="130" width="70" height="38" rx="3" fill="#4fd1c5" opacity="0.85"/>
    <path d="M568 160 l10 -12 8 8 12 -18 10 14" stroke="#0e2c40" stroke-width="2" fill="none"/>
  </g>
  <!-- IV stand -->
  <g>
    <rect x="640" y="180" width="6" height="140" fill="#9aa8a8"/>
    <circle cx="643" cy="175" r="18" fill="#dfefef" stroke="#9aa8a8" stroke-width="3"/>
    <rect x="620" y="300" width="46" height="8" fill="#9aa8a8"/>
  </g>
  <!-- cabinet with supplies -->
  <g>
    <rect x="90" y="320" width="150" height="90" fill="#ffffff" stroke="#c3d0d0" stroke-width="3"/>
    <line x1="165" y1="320" x2="165" y2="410" stroke="#c3d0d0" stroke-width="3"/>
    <rect x="105" y="335" width="45" height="20" fill="#8C1515" opacity="0.6"/>
    <rect x="180" y="335" width="45" height="20" fill="#2e5339" opacity="0.6"/>
    <rect x="105" y="365" width="45" height="20" fill="#1b3a5c" opacity="0.6"/>
    <rect x="180" y="365" width="45" height="20" fill="#c99a3f" opacity="0.6"/>
  </g>
  <!-- nurse figure -->
  <g>
    <circle cx="700" cy="330" r="22" fill="#e6c9a8"/>
    <path d="M660 430 C660 380 680 360 700 360 C720 360 740 380 740 430 Z" fill="#ffffff" stroke="#c3d0d0" stroke-width="3"/>
    <rect x="686" y="316" width="28" height="10" rx="4" fill="#ffffff"/>
    <circle cx="700" cy="322" r="4" fill="#8C1515"/>
  </g>
  <text x="400" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="#2c4b4b" opacity="0.6">NURSING SKILLS &amp; SIMULATION LAB</text>
</svg>
